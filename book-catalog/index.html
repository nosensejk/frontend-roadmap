<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог книг</title>
    <link rel="shortcut icon" href="logo.svg" type="image/x-icon" />
  </head>
  <body>
    <header>
      <h1>Каталог книг</h1>
      <nav>
        <a href="/">Главная</a>
        <a href="/books">Книги</a>
        <a href="/about">О нас</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>Популярные книги</h2>
        <table>
          <thead>
            <tr>
              <th>Название</th>
              <th>Автор</th>
              <th>Жанр</th>
              <th>Год</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>Гарри Поттер</td>
              <td>Дж. К. Роулинг</td>
              <td>Фэнтези</td>
              <td>1997</td>
            </tr>

            <tr>
              <td>Дюна</td>
              <td>Фрэнк Герберт</td>
              <td>Фантастика</td>
              <td>1965</td>
            </tr>

            <tr>
              <td>1984</td>
              <td>Джордж Оруэлл</td>
              <td>Антиутопия</td>
              <td>1949</td>
            </tr>
          </tbody>
        </table>
      </section>
      <aside>
        <h2>Фильтры</h2>
        <p>Фильтрация по жанру</p>
        <form>
          <div>
            <label for="search"> Название книги </label>

            <input
              id="search"
              type="text"
              placeholder="Введите название книги"
              minlength="2"
              maxlength="100"
            />
          </div>

          <div>
            <label for="genre"> Жанр </label>

            <select id="genre">
              <option value="all">Все жанры</option>
              <option value="fantasy">Фантастика</option>
              <option value="detective">Детектив</option>
              <option value="novel">Роман</option>
            </select>
          </div>

          <div>
            <label>
              <input type="checkbox" name="available" />
              Только доступные книги
            </label>
          </div>

          <div>
            <p>Сортировка</p>

            <label>
              <input type="radio" name="sort" value="newest" checked />
              Сначала новые
            </label>

            <label>
              <input type="radio" name="sort" value="oldest" />
              Сначала старые
            </label>
          </div>

          <button type="submit">Найти</button>

          <button type="reset">Сбросить</button>
        </form>
      </aside>
    </main>

    <footer>
      <p>© 2026 Book Catalog</p>
    </footer>
  </body>
</html>
