<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог книг</title>
    <link rel="shortcut icon" href="logo.svg" type="image/x-icon" />
  </head>
  <body>
    <header>
      <a href="/">
        <img src="book.svg" alt="Logo" />
        Book Catalog
      </a>

      <nav>
        <a href="/catalog"> Catalog </a>

        <a href="/authors"> Authors </a>

        <a href="/about"> About Us </a>
      </nav>

      <button>Log In</button>
    </header>

    <main>
      <section>
        <h1>Book Catalog</h1>

        <form>
          <label for="search"> Book Title </label>

          <input id="search" type="text" placeholder="Search a book..." />

          <label for="genre"> Genre </label>

          <select id="genre">
            <option value="all">Genre</option>

            <option value="fantasy">Fantasy</option>
          </select>

          <button type="submit">Search</button>
        </form>
      </section>

      <section>
        <article>
          <img src="dune.jpg" alt="Cover of the book «Dune»" />

          <h2>Dune</h2>

          <p>F. Herbert</p>
        </article>

        <article>
          <img src="1984.jpg" alt="Cover of the book «1984»" />

          <h2>1984</h2>

          <p>G. Orwell</p>
        </article>

        <article>
          <img src="hamlet.jpg" alt="Cover of the book «Hamlet»" />

          <h2>Hamlet</h2>

          <p>W. Shakespeare</p>
        </article>
      </section>
    </main>

    <footer>
      <p>© 2026 Book Catalog. All rights reserved.</p>
    </footer>
  </body>
</html>
